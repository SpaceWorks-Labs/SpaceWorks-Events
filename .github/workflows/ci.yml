name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          # Prisma resolves datasource URLs while validating the schema, even
          # though this command does not connect to the database.
          DATABASE_URL: postgresql://build:build@localhost:5432/swevents
          DIRECT_URL: postgresql://build:build@localhost:5432/swevents
      - run: npm run lint
      # The guide's generated index must match content/help (npm run help:index).
      - run: node scripts/generate-help-index.mjs --check
      # The frontend catalog must match the view readers and actions (npm run frontend:catalog).
      - run: node scripts/generate-frontend-catalog.mjs --check
      # Route types (RouteContext, typed routes) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/swevents
          AUTH_SECRET: ci-placeholder-not-used-at-build
      - name: npm audit --omit=dev --audit-level=high
        run: node scripts/npm-audit.mjs --omit=dev --audit-level=high

  migration-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swevents
          POSTGRES_PASSWORD: swevents
          POSTGRES_DB: swevents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swevents -d swevents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://swevents:swevents@localhost:5432/swevents
          DIRECT_URL: postgresql://swevents:swevents@localhost:5432/swevents
      - run: npm run db:verify
        env:
          DATABASE_URL: postgresql://swevents:swevents@localhost:5432/swevents

  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        deployment: [split, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Generates independent disposable credentials and removes only its own
      # PostgreSQL/Redis containers. No deployed database or hosting keys needed.
      - run: npm run test:e2e:${{ matrix.deployment }}

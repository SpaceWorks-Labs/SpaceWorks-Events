name: Quality gate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swevents
          POSTGRES_PASSWORD: swevents_ci
          POSTGRES_DB: swevents_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swevents -d swevents_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://swevents:swevents_ci@localhost:5432/swevents_ci
      DIRECT_URL: postgresql://swevents:swevents_ci@localhost:5432/swevents_ci
      TEST_DATABASE_URL: postgresql://swevents:swevents_ci@localhost:5432/swevents_ci
      AUTH_SECRET: ci-only-not-a-production-secret-0123456789
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-not-for-production-0123456789
      HEALTHCHECK_SECRET: ci-health-secret-not-for-production-012345
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      EMAIL_FROM: Space Works Events CI <noreply@example.test>
      SMTP_SERVICE: test
      SMTP_ALLOW_UNAUTHENTICATED: "1"
      TRUSTED_PROXY_IP_HEADER: x-forwarded-for
      S3_BUCKET: swevents-ci
      S3_REGION: us-east-1
      ALLOW_INSECURE_PRODUCTION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit --omit=dev
        run: node scripts/npm-audit.mjs --omit=dev
      - run: npm run db:deploy
      - run: npm run db:verify
      - run: npm run lint
      # Route types (RouteContext, typed routes) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run production:check
      - run: npm run build
      - run: docker build --secret id=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" -t swevents:ci .
      - name: Smoke-test standalone container
        # MIGRATE_ON_START exercises the entrypoint's bundled Prisma CLI
        # (a no-op here because db:deploy already ran).
        run: |
          docker run -d --name swevents-ci --network host \
            -e CI=true -e ALLOW_INSECURE_PRODUCTION_TESTS=1 -e MIGRATE_ON_START=1 \
            -e DATABASE_URL -e DIRECT_URL -e AUTH_SECRET -e AUTH_URL -e NEXT_PUBLIC_BASE_URL \
            -e REDIS_URL -e CRON_SECRET -e HEALTHCHECK_SECRET \
            -e NEXT_SERVER_ACTIONS_ENCRYPTION_KEY -e MFA_ENCRYPTION_KEY \
            -e EMAIL_FROM -e SMTP_SERVICE -e SMTP_ALLOW_UNAUTHENTICATED \
            -e TRUSTED_PROXY_IP_HEADER -e S3_BUCKET -e S3_REGION swevents:ci
          # The server needs a few seconds to boot; print its logs if it never answers.
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/api/health; then
            docker logs swevents-ci
            docker rm -f swevents-ci
            exit 1
          fi
          curl --fail --header "Authorization: Bearer $HEALTHCHECK_SECRET" http://127.0.0.1:3000/api/health/db
          docker logs swevents-ci 2>&1 | grep -q "Applying database migrations"
          docker exec swevents-ci node -e "require('sharp'); console.log('sharp loads in the image')"
          docker rm -f swevents-ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production
        env:
          # The specs give each browser context its own client IP through
          # cf-connecting-ip, so per-IP limits (10 sign-ins/min) don't couple tests.
          TRUSTED_PROXY_IP_HEADER: cf-connecting-ip
          # tests/e2e/webhooks.spec.ts posts to a local receiver; honoured by the
          # production build only with CI=true and ALLOW_INSECURE_PRODUCTION_TESTS=1.
          WEBHOOKS_ALLOW_PRIVATE_TARGETS: "1"
      # The payment flows drive a local fake Razorpay/Stripe, which the app
      # refuses in production builds, so they run against a dev server.
      - name: Payment browser flows against the fake provider
        run: npx playwright test tests/e2e/payments.spec.ts
        env:
          PLAYWRIGHT_FAKE_PAYMENTS: "1"
          TRUSTED_PROXY_IP_HEADER: cf-connecting-ip
          PLAYWRIGHT_PORT: "3100"
          PLAYWRIGHT_SERVER_COMMAND: npx next dev --port 3100 --hostname 127.0.0.1
          AUTH_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3100

openapi: 3.1.0
info:
  title: Space Works Events Mobile API
  version: "1.0.0"
  summary: User-authenticated REST API for the Space Works mobile apps (Android and iOS).
  description: |
    Machine-readable contract for `/api/mobile/v1`. The prose guide is
    `docs/MOBILE_API.md`. Response payloads are validated on the server by the
    strict Zod schemas in `lib/mobile/schemas.ts`; `tests/unit/mobile-api-contract.test.ts`
    checks the fixtures in `docs/mobile-api-fixtures/` against both this file
    and those schemas, and checks that every path here has a route handler.

    Every response is JSON with `Cache-Control: no-store`. Success:
    `{ "ok": true, "data": ... }`. Failure: `ErrorEnvelope`.

    The app calls the API host directly (the backend in a split
    installation). Organiser routes (`/orgs/...`) need the staff authenticator
    check on the app session: `STAFF_MFA_REQUIRED` until a code is confirmed
    (sign in with `totp`, or `POST /auth/mfa`), `STAFF_MFA_ENROLMENT_REQUIRED`
    while the account has none (set one up on the website).
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://api.events.example
        description: The installation's API origin (the backend host in a split installation).
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Public
  - name: Organiser
  - name: Teams
  - name: Judging
  - name: Check-in
  - name: Emails
  - name: Day-of
  - name: Reused web endpoints
  - name: App links
  - name: Orders
  - name: Claims
  - name: Payments
  - name: Finance
  - name: Mentor Desk
  - name: Mentor console
  - name: Volunteers
  - name: Applications

paths:
  /api/mobile/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, deviceId]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 128 }
                totp: { type: string, maxLength: 32, description: Authenticator code or recovery code. }
                emailCode: { type: string, maxLength: 12, description: The six-digit code emailed after `EMAIL_CODE_REQUIRED`. }
                deviceId: { $ref: "#/components/schemas/DeviceId" }
                deviceName: { type: string, maxLength: 120 }
                platform: { $ref: "#/components/schemas/Platform" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "`UNAUTHENTICATED` (wrong email or password), or, only after a correct password, `MFA_REQUIRED` or `EMAIL_CODE_REQUIRED` (a new install or recent failures: a code was emailed).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "403": { description: "`EMAIL_VERIFICATION_REQUIRED`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/google:
    post:
      tags: [Auth]
      summary: Exchange a Google ID token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idToken, deviceId]
              properties:
                idToken: { type: string, maxLength: 8192 }
                deviceId: { $ref: "#/components/schemas/DeviceId" }
                deviceName: { type: string, maxLength: 120 }
                platform: { $ref: "#/components/schemas/Platform" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: Token failed verification., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "403": { description: Google sign-in not configured, account creation disabled, or linking refused., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Returns new access and refresh tokens. Replaying the previous refresh
        token within 30 seconds of a rotation (a lost response) is a plain 401;
        later replays revoke the session. The refresh token works only with the
        `deviceId` that signed in; from any other install it revokes the session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken, deviceId]
              properties:
                refreshToken: { type: string }
                deviceId: { $ref: "#/components/schemas/DeviceId" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current mobile session
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere (web and mobile)
      description: Needs a sign-in in the last 10 minutes; otherwise 401 `REAUTH_REQUIRED` (sign in again, then retry).
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/mfa:
    post:
      tags: [Auth]
      summary: Confirm an authenticator code on this app session (staff)
      description: Staff access then works for 12 hours, as after /verify-mfa on the website. Setting an authenticator up stays on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, minLength: 6, maxLength: 32, description: Authenticator or recovery code. } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MfaVerifiedResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "`STAFF_MFA_ENROLMENT_REQUIRED`: the account has no authenticator.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/auth/config:
    get:
      tags: [Auth]
      summary: Public instance configuration for the sign-in screen
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthConfigResponse" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me:
    get:
      tags: [Me]
      summary: The signed-in user, organisations and event collaborations
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MeResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [Me]
      summary: Update the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations:
    get:
      tags: [Me]
      summary: The caller's own registrations and certificates
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationsResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations/{rsvpId}/cancel:
    post:
      tags: [Me]
      summary: Cancel one of the caller's own RSVPs
      description: A ticket with money collected or still owed at the desk, or a PER_TEAM leader's team ticket, answers 409 `PAID_ORDER`; cancel its order instead (POST /me/orders/{orderId}/cancel) under the refund policy. A paid request is withdrawn and a held order released.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations/{rsvpId}/team:
    get:
      tags: [Me]
      summary: The team of one of the caller's own registrations (names only)
      description: |
        `{ "team": null }` for a solo registration. Anyone else's RSVP is
        `NOT_FOUND`. Members are shown as first name and last initial; never
        emails, answers, tickets or team links.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyTeamResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations/{rsvpId}/attendance:
    get:
      tags: [Me]
      summary: '"Are you still coming?" for one of the caller''s own registrations'
      description: |
        Attendance confirmation (docs/ATTENDANCE.md). `{ "attendance": null }`
        when the registration was never asked. Anyone else's RSVP is
        `NOT_FOUND`. The /attend link token is never returned.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyAttendanceResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Me]
      summary: Answer it (same rules as the /attend page)
      description: |
        Open until the event starts, and only while the registration is
        confirmed. With "Free the place when a guest says No" on, a No
        releases a free place, cancels a paid single ticket the caller bought
        under the refund policy, or keeps the place and opens a refund request
        once the policy has closed; an order with several tickets is never
        cancelled. `released` true means the registration no longer exists.
        Not asked: `NOT_FOUND`. Closed: `CONFLICT`.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, enum: [ATTENDING, NOT_ATTENDING] }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceReplyResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/discover:
    get:
      tags: [Public]
      summary: Upcoming publicly listed events
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/search:
    get:
      tags: [Public]
      summary: Search publicly listed events (same rules as /api/search, max 48)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/short/{code}:
    get:
      tags: [Public]
      summary: Resolve an event short link
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, minLength: 7, maxLength: 7 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ShortLinkResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/events/{orgSlug}/{eventSlug}:
    get:
      tags: [Public]
      summary: Public event page as data
      description: A bearer token, if sent, identifies the viewer (invite-only access, `myRsvp`). An invalid bearer is 401.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventSlug" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicEventResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/public/events/{orgSlug}/{eventSlug}/feedback:
    get:
      tags: [Public]
      summary: The open feedback form
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventSlug" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackFormResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/rsvp:
    post:
      tags: [Public]
      summary: Register for an event (same body and rules as POST /api/rsvp)
      description: |
        Free registrations answer CONFIRMED, WAITLISTED or PENDING_APPROVAL. A
        paid registration is never a ticket until paid: PENDING_PAYMENT with the
        order id, the hosted checkout address (open it in the system browser)
        and when the hold ends; poll GET /me/orders/{orderId}. A paid request on
        an approval event answers PENDING_APPROVAL with its order id. Buying
        tickets needs a bearer. `team` registers on a team event; without it the
        registration is solo, which a teams-only event refuses (`TEAM_REQUIRED`).
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 }, description: "Required with a bearer (a signed-in registration runs at most once per key; a replay carries `ticketToken: null`). The guest flow has no key." }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgSlug]
              properties:
                orgSlug: { type: string }
                eventSlug: { type: string }
                eventInstanceId: { type: string }
                name: { type: string, description: Required for guests; optional for signed-in users who already have a name. }
                guestEmail: { type: string, format: email, description: Guests only. }
                answers: { type: object, additionalProperties: true, description: "Keyed by registration field `key`." }
                ticketTypeId: { type: string, description: Shorthand for one ticket of this type. }
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [ticketTypeId, quantity]
                    properties:
                      ticketTypeId: { type: string }
                      quantity: { type: integer, minimum: 0, maximum: 20 }
                      amountMinor: { type: [integer, "null"], description: Pay what you want, per ticket, in minor units. }
                addOns: { type: array, items: { type: object, additionalProperties: false, required: [addOnId, quantity], properties: { addOnId: { type: string }, quantity: { type: integer } } } }
                promoCode: { type: string, maxLength: 32 }
                accessCode: { type: string, maxLength: 32 }
                payAtDesk: { type: boolean, description: Reserve now and pay in person, where every chosen ticket allows it. }
                attendees: { type: array, items: { type: object, additionalProperties: false, properties: { name: { type: string }, email: { type: string } } }, description: Details for the second and later tickets. }
                team: { type: object, additionalProperties: true, description: "Team intent, as POST /api/rsvp: create a team, join with a join link, or solo." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RsvpResultResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: "`TEAM_REQUIRED` (a team event that registers teams only; register on the website) or `CONFLICT`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events:
    get:
      tags: [Organiser]
      summary: Events the caller can work on in this organisation
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { name: filter, in: query, schema: { type: string, enum: [upcoming, past, all], default: upcoming } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgEventsResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}:
    get:
      tags: [Organiser]
      summary: Organiser event detail
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgEventDetailResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests:
    get:
      tags: [Organiser]
      summary: Guest list (organisation admins or CHECK_IN holders)
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: status, in: query, schema: { type: string, enum: [ALL, CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED], default: ALL } }
        - { name: checkedIn, in: query, schema: { type: string, enum: [any, "yes", "no"], default: any } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestListResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Organiser]
      summary: Add a guest (organisation admins)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                answers: { type: object, additionalProperties: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/restore:
    post:
      tags: [Organiser]
      summary: Undo a guest deletion within five minutes (404 unless the undo belongs to this event)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [undoId], properties: { undoId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}:
    get:
      tags: [Organiser]
      summary: One guest with registration answers
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestDetailResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Organiser]
      summary: Delete a guest (organisation admins); returns an undo id
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UndoResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/approve:
    post:
      tags: [Organiser]
      summary: Approve a pending request (organisation admins)
      description: A guest who belongs to a team is refused with `TEAM_MEMBER` (409); change the whole team with `…/teams/{teamId}/approve`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`CONFLICT`, or `TEAM_MEMBER` for a guest in a team.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/reject:
    post:
      tags: [Organiser]
      summary: Reject a pending or waitlisted guest (organisation admins)
      description: A guest who belongs to a team is refused with `TEAM_MEMBER` (409); change the whole team with `…/teams/{teamId}/reject`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`CONFLICT`, or `TEAM_MEMBER` for a guest in a team.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/promote:
    post:
      tags: [Organiser]
      summary: Promote a waitlisted guest (organisation admins)
      description: A guest who belongs to a team is refused with `TEAM_MEMBER` (409); change the whole team with `…/teams/{teamId}/promote`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`CONFLICT`, or `TEAM_MEMBER` for a guest in a team.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/attendance-link:
    post:
      tags: [Organiser]
      summary: Share one confirmed guest's attendance link by hand (owners and admins)
      description: |
        Requires `sendEmails`. No email is sent. Each call issues a new
        /attend link that replaces any earlier one (only its digest is
        stored, so it can't be shown again); a guest not yet asked counts as
        asked. Refused once the event has started or is cancelled, and for a
        guest who isn't a confirmed, non-crew attendee. Audited without the token.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceLinkResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/guests/{rsvpId}/reaccept:
    post:
      tags: [Organiser]
      summary: Re-accept a declined guest (organisation admins); confirmed when there is room, otherwise waitlisted
      description: A member of a declined team is refused with `TEAM_MEMBER` (409).
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/rsvpId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GuestResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/teams:
    get:
      tags: [Teams]
      summary: Teams view (organisation admins or the MANAGE_REGISTRATIONS grant)
      description: |
        The web Guests → Teams view: same permission (`canManageRegistrationsFor`;
        a `CHECK_IN`- or `JUDGE`-only collaborator gets `FORBIDDEN`), query and
        `search` rate-limit bucket. Oldest team first, keyset cursor. `q` matches
        team names and members' names and emails (wildcards literal). `counts`
        are per filter over the whole event.
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: status, in: query, schema: { type: string, enum: [ALL, CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED, INCOMPLETE, LOOKING], default: ALL } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/teams/{teamId}/approve:
    post:
      tags: [Teams]
      summary: Approve a whole pending team (every member confirmed together)
      description: Same permission (`canManageRegistrationsFor`), core (`transitionTeamStatus`), transaction, emails, webhooks, audit and `rsvp` rate limit as the dashboard. Returns the updated team.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/teamId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`TEAM_INCOMPLETE` below the minimum team size, `CAPACITY_FULL` with no free unit, `CONFLICT` when not pending, the event is closed, or another organiser changed it.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/teams/{teamId}/reject:
    post:
      tags: [Teams]
      summary: Decline a whole pending or waitlisted team
      description: Same permission (`canManageRegistrationsFor`), core (`transitionTeamStatus`), transaction, emails, webhooks, audit and `rsvp` rate limit as the dashboard. Returns the updated team.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/teamId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`CONFLICT` for any other status or a concurrent change.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/teams/{teamId}/promote:
    post:
      tags: [Teams]
      summary: Give a waitlisted team a place (one unit)
      description: Same permission (`canManageRegistrationsFor`), core (`transitionTeamStatus`), transaction, emails, webhooks, audit and `rsvp` rate limit as the dashboard. Returns the updated team.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/teamId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`CAPACITY_FULL` while the event is still full, `CONFLICT` when not waitlisted or changed concurrently.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/submissions:
    get:
      tags: [Judging]
      summary: The judge's projects (25 per page, oldest submission first)
      description: |
        Judges only (organisation OWNER/ADMIN or the event `JUDGE` grant, as the
        web judge workspace). Lists only projects this judge may score:
        `SUBMITTED`, assigned unless judges see all, and never an entrant the
        judge's own account belongs to (conflict of interest). `counts` cover
        everything the judge may see, ignoring the search. `search` rate-limit
        bucket. An organiser without the judging right gets `FORBIDDEN`; an
        event without submissions switched on is `NOT_FOUND`.
      parameters:
        - { name: roundId, in: query, schema: { type: string }, description: A round to show; the current round when absent. }
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: filter, in: query, schema: { type: string, enum: [all, todo, inProgress, reviewed], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Project title, team name, or a solo entrant's first name. }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgeSubmissionListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/next:
    get:
      tags: [Judging]
      summary: Score next project (picked on the server)
      description: |
        Among the projects this judge may score and has not submitted a review
        for: one they started first, then the fewest submitted reviews, then the
        oldest submission. `next` is null when nothing is left or judging is not
        `OPEN`; `remaining` counts what is left including `next`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: roundId, in: query, schema: { type: string }, description: A round to show; the current round when absent. }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgeNextResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/criteria:
    get:
      tags: [Judging]
      summary: The rubric and the judging status
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: roundId, in: query, schema: { type: string }, description: A round to show; the current round when absent. }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgingCriteriaResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/submissions/{submissionId}:
    get:
      tags: [Judging]
      summary: One project with this judge's own saved scores and comment
      description: "`NOT_VISIBLE` (404) for a project this judge may not score (unassigned, conflict of interest, not submitted, or another event's); `NOT_FOUND` (404) when the event no longer takes submissions, as on every judging route."
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/submissionId" }, { name: roundId, in: query, schema: { type: string }, description: A round to show; the current round when absent. }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgeSubmissionDetailResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/submissions/{submissionId}/scores:
    put:
      tags: [Judging]
      summary: Save some or all scores (and optionally the comment) without submitting
      description: |
        Upserts this judge's score per criterion (whole numbers, 0..maxScore).
        With `comment`, also saves the private comment as a draft. Refusals:
        `JUDGING_CLOSED` (409, judging not open), `NOT_VISIBLE` (404),
        `INVALID_REQUEST` (unknown criterion, out of range, duplicate criterion).
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/submissionId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scores]
              properties:
                scores: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ScoreInput" } }
                comment: { type: string, maxLength: 2000, description: Private comment (organisers only); saved as a draft. }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgeScoresSavedResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/submissions/{submissionId}/review:
    post:
      tags: [Judging]
      summary: Submit this judge's review
      description: |
        Optional `scores` are saved first; the review is then submitted once
        every criterion is scored. Without `comment`, the saved draft comment
        is kept. Refusals: `JUDGING_CLOSED` (409), `INCOMPLETE_SCORES` (409,
        a criterion is unscored or there is no rubric), `NOT_VISIBLE` (404).
        Returns the project as `GET …/judging/submissions/{submissionId}`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/submissionId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scores: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ScoreInput" } }
                comment: { type: string, maxLength: 2000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JudgeSubmissionDetailResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/judging/submissions/{submissionId}/recusal:
    post:
      tags: [Judging]
      summary: Recuse yourself from an assigned project
      description: |
        As the web "Recuse myself": the project leaves this judge's list and
        doesn't count towards coverage, and organisers see the recusal.
        Only for a project assigned to this judge in the open round, before
        their review of it is submitted. Idempotent. Refusals:
        `JUDGING_CLOSED` (409), `NOT_VISIBLE` (404, not assigned to you in
        the open round), `CONFLICT` (409, your review of it is submitted).
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/submissionId" }]
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [Judging]
      summary: Undo a recusal
      description: The project returns to this judge's list while the round is open. Idempotent. Refusals as for `POST`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/submissionId" }]
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/preview:
    post:
      tags: [Check-in]
      summary: Look up a ticket before checking in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `rawInput` or `rsvpId`.
              properties:
                rawInput: { type: string, maxLength: 2048, description: QR payload, ticket URL or typed code. }
                rsvpId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInPreviewResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in:
    post:
      tags: [Check-in]
      summary: Check a guest in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `rawInput` (source `mobile-scan`) or `rsvpId` (source `mobile-manual`).
              properties:
                rawInput: { type: string, maxLength: 2048 }
                rsvpId: { type: string }
                force: { type: boolean, default: false }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInResultResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`NEEDS_FORCE` (retry with `force: true`) or `CONFLICT`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/undo:
    post:
      tags: [Check-in]
      summary: Undo a check-in
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [rsvpId], properties: { rsvpId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/lookup:
    get:
      tags: [Check-in]
      summary: Search guests at the door (max 12)
      parameters:
        - { $ref: "#/components/parameters/orgSlug" }
        - { $ref: "#/components/parameters/eventId" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LookupResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/stats:
    get:
      tags: [Check-in]
      summary: Door counts and the ten latest check-ins
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckInStatsResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/roster:
    get:
      tags: [Check-in]
      summary: Offline roster (includes ticket tokens; CHECK_IN only)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RosterResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/check-in/sync:
    post:
      tags: [Check-in]
      summary: Upload offline check-ins
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkIns]
              properties:
                checkIns:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [rsvpId, checkedInAt]
                    properties:
                      rsvpId: { type: string }
                      checkedInAt: { type: string, format: date-time }
                      force: { type: boolean, default: false }
                      clientMutationId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/broadcasts/meta:

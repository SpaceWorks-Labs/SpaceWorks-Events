      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReimbursementPoliciesResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/finance/refund-requests/{requestId}/decide:
    post:
      tags: [Finance]
      summary: Approve (refunding) or decline a refund request
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { $ref: "#/components/parameters/requestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [decision], properties: { decision: { type: string, enum: [approve, decline] }, amount: { type: string, maxLength: 20 }, cancelTickets: { type: boolean }, note: { type: string, maxLength: 500 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminClaimsResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/crew:
    get:
      tags: [Organiser]
      summary: The event crew with check-in and the food summary (MANAGE_REGISTRATIONS)
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CrewListResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Organiser]
      summary: Add a crew member and email their free crew ticket
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name, email], properties: { name: { type: string, maxLength: 200 }, email: { type: string, maxLength: 320 }, role: { type: string, maxLength: 80 }, foodPreference: { type: string, maxLength: 80 } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CrewListResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/crew/{memberId}:
    delete:
      tags: [Organiser]
      summary: Remove a crew member and their crew ticket
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: memberId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/NullData" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/ticket/{token}/status:
    get:
      tags: [Reused web endpoints]
      summary: Live ticket check-in state (per-IP rate limited)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK (not enveloped)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [checkedIn, checkedInAt]
                properties:
                  checkedIn: { type: boolean }
                  checkedInAt: { type: [string, "null"], format: date-time }
        "404": { description: Unknown or malformed token (empty body). }
        "429": { description: Rate limited. }
        default: { $ref: "#/components/responses/Error" }

  /api/ticket/{token}/events:
    get:
      tags: [Reused web endpoints]
      summary: Server-sent events stream of the ticket's check-in state
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "`text/event-stream` of `{ checkedIn, checkedInAt }` messages.", content: { text/event-stream: { schema: { type: string } } } }
        "404": { description: Unknown or malformed token. }
        "429": { description: Rate limited. }
        default: { $ref: "#/components/responses/Error" }

  /api/feedback:
    post:
      tags: [Reused web endpoints]
      summary: Submit feedback (not enveloped like the mobile API)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orgSlug, eventSlug]
              properties:
                orgSlug: { type: string }
                eventSlug: { type: string }
                email: { type: string, format: email, description: Required when certificates are enabled. }
                answers: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  data: { type: object, properties: { certificateToken: { type: [string, "null"] } } }
        "400": { description: "`{ ok: false, error: string }`." }
        "413": { description: Body over 128 KiB. }
        "429": { description: Rate limited. }
        default: { $ref: "#/components/responses/Error" }

  /api/feedback/certificate/{token}:
    get:
      tags: [Reused web endpoints]
      summary: Certificate JPEG
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: JPEG image., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { description: Unknown token. }
        default: { $ref: "#/components/responses/Error" }

  /api/check-in/station:
    post:
      tags: [Reused web endpoints]
      summary: Venue check-in station (cookie-based station proof; keep a per-station cookie jar)
      security: []
      description: See `app/api/check-in/station/route.ts`. Not part of the bearer-authenticated mobile API.
      responses:
        "200": { description: Station operation result. }
        "401": { description: Missing or invalid station proof. }
        "429": { description: Rate limited. }
        default: { $ref: "#/components/responses/Error" }

  /.well-known/assetlinks.json:
    get:
      tags: [App links]
      summary: Android Digital Asset Links (package from ANDROID_APP_PACKAGE_NAME at runtime)
      security: []
      responses:
        "200": { description: "Statement list; `[]` when `ANDROID_APP_SHA256_FINGERPRINTS` is unset.", content: { application/json: { schema: { type: array } } } }
        default: { $ref: "#/components/responses/Error" }

  /.well-known/apple-app-site-association:
    get:
      tags: [App links]
      summary: Apple App Site Association (APPLE_APP_IDS at runtime)
      security: []
      responses:
        "200": { description: "Claims `/ticket/*`, `/*/*/feedback` and `/*/*` after excluding application paths (see MOBILE_API.md); `{ applinks: { details: [] } }` when `APPLE_APP_IDS` is unset.", content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token from a `Session` (prefix `swa_`, 15 minutes). Refresh once on 401, then sign out."

  parameters:
    orgSlug: { name: orgSlug, in: path, required: true, schema: { type: string } }
    eventSlug: { name: eventSlug, in: path, required: true, schema: { type: string } }
    eventId: { name: eventId, in: path, required: true, schema: { type: string } }
    rsvpId: { name: rsvpId, in: path, required: true, schema: { type: string } }
    teamId: { name: teamId, in: path, required: true, schema: { type: string } }
    submissionId: { name: submissionId, in: path, required: true, schema: { type: string } }
    orderId: { name: orderId, in: path, required: true, schema: { type: string } }
    claimId: { name: claimId, in: path, required: true, schema: { type: string } }
    receiptId: { name: receiptId, in: path, required: true, schema: { type: string } }
    listId: { name: listId, in: path, required: true, schema: { type: string } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string } }
    instanceId: { name: instanceId, in: path, required: true, schema: { type: string } }

  responses:
    Error:
      description: >-
        Error envelope (docs/MOBILE_API.md). Any status an operation does not
        list, such as 400 `INVALID_REQUEST`, 401 `UNAUTHENTICATED`, 404
        `NOT_FOUND` or 429 `RATE_LIMITED`, uses this envelope; so does an
        unknown path under /api/mobile/v1.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NullData:
      description: OK
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: "null" } } }
    Session:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } }

  schemas:
    Platform: { type: string, enum: [android, ios] }
    RsvpStatus: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED, PENDING_PAYMENT], description: "PENDING_PAYMENT: a paid place held while the buyer pays; never a ticket until paid." }
    DeviceId: { type: string, pattern: "^[a-f0-9]{32,64}$", description: "The app install's own random id, kept for the life of the install. Only its SHA-256 is stored." }
    EventStatus: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN, CANCELLED] }
    PrivacyType: { type: string, enum: [PUBLIC, HIDDEN_LINK, APPROVAL_REQUIRED, INVITE_ONLY] }
    MembershipRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
    EventPermission: { type: string, enum: [EDIT_DETAILS, MANAGE_REGISTRATIONS, MANAGE_INVITATIONS, CHECK_IN, PUBLISH_AND_SCHEDULE, JUDGE] }
    FieldType: { type: string, enum: [TEXT, TEXTAREA, EMAIL, PHONE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, NUMBER, DATE] }
    Attendance: { type: string, enum: [ANY, CHECKED_IN, NOT_CHECKED_IN], default: ANY }
    RegistrationMode: { type: string, enum: [INDIVIDUAL, TEAM], description: "TEAM: capacity counts teams plus solo registrants (\"teams & solo places\")." }
    JudgingStatus: { type: string, enum: [NOT_STARTED, OPEN, CLOSED] }
    ReviewStatus: { type: string, enum: [NONE, DRAFT, SUBMITTED], description: "SUBMITTED once submitted; DRAFT once any score or comment is saved." }
    DateTime: { type: string, format: date-time }
    NullableDateTime: { type: [string, "null"], format: date-time }
    NullableUrl: { type: [string, "null"], format: uri }

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, MFA_REQUIRED, EMAIL_VERIFICATION_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, NEEDS_FORCE, RATE_LIMITED, TEAM_REQUIRED, TEAM_MEMBER, TEAM_INCOMPLETE, CAPACITY_FULL, JUDGING_CLOSED, INCOMPLETE_SCORES, NOT_VISIBLE, INTERNAL_ERROR, STAFF_MFA_REQUIRED, STAFF_MFA_ENROLMENT_REQUIRED, EMAIL_CODE_REQUIRED, TOO_MANY_ATTEMPTS, REAUTH_REQUIRED, PAID_ORDER, REGISTRATION_CLOSED, PAYMENT_UNAVAILABLE, PAYLOAD_TOO_LARGE] }
            message: { type: string, description: UI-safe text. }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, imageUrl, emailVerified, mfaEnabled]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        imageUrl: { $ref: "#/components/schemas/NullableUrl" }
        emailVerified: { type: boolean }
        mfaEnabled: { type: boolean }

    Session:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        user: { $ref: "#/components/schemas/User" }

    AuthConfig:
      type: object
      additionalProperties: false
      required: [instanceName, googleSignIn, signupEnabled, paidEventsEnabled, baseUrl]
      properties:
        instanceName: { type: string }
        googleSignIn:
          type: object
          additionalProperties: false
          required: [enabled, webClientId]
          properties:
            enabled: { type: boolean }
            webClientId: { type: [string, "null"] }
        signupEnabled: { type: boolean }
        paidEventsEnabled: { type: boolean, description: Paid tickets are switched on for this installation. }
        baseUrl: { type: string, format: uri }

    OrgSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, logoUrl, role]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        logoUrl: { $ref: "#/components/schemas/NullableUrl" }
        role: { $ref: "#/components/schemas/MembershipRole" }

    Collaboration:
      type: object
      additionalProperties: false
      required: [organisation, eventId, eventTitle, permissions]
      properties:
        organisation: { type: object, additionalProperties: false, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        eventId: { type: string }
        eventTitle: { type: string }
        permissions: { type: array, items: { $ref: "#/components/schemas/EventPermission" } }

    JudgingEvent:
      type: object
      additionalProperties: false
      description: An event the caller judges through a JUDGE grant, once it takes submissions. Organisation admins use `myPermissions.judge` on the org event list.
      required: [organisation, eventId, eventTitle, startDateTime, endDateTime, timezone, judgingStatus]
      properties:
        organisation: { type: object, additionalProperties: false, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        eventId: { type: string }
        eventTitle: { type: string }
        startDateTime: { $ref: "#/components/schemas/DateTime" }
        endDateTime: { $ref: "#/components/schemas/DateTime" }
        timezone: { type: string }
        judgingStatus: { $ref: "#/components/schemas/JudgingStatus" }

    Me:
      type: object
      additionalProperties: false
      required: [user, organisations, collaborations, judging, staffMfa]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organisations: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
        collaborations: { type: array, items: { $ref: "#/components/schemas/Collaboration" } }
        judging: { type: array, items: { $ref: "#/components/schemas/JudgingEvent" } }
        staffMfa: { type: string, enum: [ok, verify, enrol], description: "The staff authenticator rule for this app session: verify (POST /auth/mfa) or enrol (on the website). Attendees are always ok." }

    EventSummary:
      description: Closed form of EventSummaryFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/EventSummaryFields" }]
      unevaluatedProperties: false

    EventSummaryFields:
      description: The EventSummary properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [id, slug, title, coverImageUrl, startDateTime, endDateTime, timezone, location, mapLinkUrl, isOnline, accentColor, status, registrationMode, organisation]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        coverImageUrl: { $ref: "#/components/schemas/NullableUrl" }
        startDateTime: { $ref: "#/components/schemas/DateTime" }
        endDateTime: { $ref: "#/components/schemas/DateTime" }
        timezone: { type: string, description: IANA time zone. }
        location: { type: string }
        mapLinkUrl: { type: [string, "null"] }
        isOnline: { type: boolean }
        accentColor: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        registrationMode: { $ref: "#/components/schemas/RegistrationMode" }
        organisation:
          type: object
          additionalProperties: false
          required: [slug, name, logoUrl]
          properties:
            slug: { type: string }
            name: { type: string }
            logoUrl: { $ref: "#/components/schemas/NullableUrl" }

    EventList:
      type: object
      additionalProperties: false
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } }
        nextCursor: { type: [string, "null"] }

    Registration:
      type: object
      additionalProperties: false
      required: [rsvpId, status, checkedInAt, registeredAt, canCancel, ticketToken, orderId, event, instanceId]
      properties:
        rsvpId: { type: string }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        canCancel: { type: boolean }
        ticketToken: { type: [string, "null"], description: Only for CONFIRMED registrations. }
        orderId: { type: [string, "null"], description: "The paid order this registration belongs to (GET /me/orders/{orderId})." }
        isCrew: { const: true, description: The caller's free crew ticket; present only when true. }
        event: { $ref: "#/components/schemas/EventSummary" }
        instanceId: { type: [string, "null"], description: Set for a recurring-series occurrence; `event` then describes the series. }
        team: { $ref: "#/components/schemas/MyTeam" }

    MyTeam:
      type: object
      additionalProperties: false
      description: The caller's own team (present only for a registration in a team). Names only.
      required: [id, name, role, size, maxSize, members]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [LEADER, MEMBER], description: The caller's role. }
        size: { type: integer }
        maxSize: { type: [integer, "null"] }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [displayName, isLeader]
            properties:
              displayName: { type: string, description: First name and last initial. }
              isLeader: { type: boolean }

    MyTeamResult:
      type: object
      additionalProperties: false
      required: [team, order]
      properties:
        team:
          oneOf:
            - { $ref: "#/components/schemas/MyTeam" }
            - { type: "null" }
        order:
          type: [object, "null"]
          additionalProperties: false
          required: [orderId, status, holdExpiresAt]
          description: The caller's order for a paid team place, if any.
          properties:
            orderId: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
            holdExpiresAt: { $ref: "#/components/schemas/NullableDateTime" }

    Registrations:
      type: object
      additionalProperties: false
      required: [upcoming, past, certificates]
      properties:
        upcoming: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        past: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        certificates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [eventTitle, organisationName, issuedAt, certificateUrl]
            properties:
              eventTitle: { type: string }
              organisationName: { type: string }
              issuedAt: { $ref: "#/components/schemas/DateTime" }
              certificateUrl: { type: string, format: uri }

    ShortLink:
      type: object
      additionalProperties: false
      required: [orgSlug, eventSlug]
      properties:
        orgSlug: { type: string }
        eventSlug: { type: string }

    RegistrationField:
      type: object
      additionalProperties: false
      required: [id, key, label, type, required, helpText, placeholder, options, settings, showIf]
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/FieldType" }
        required: { type: boolean }
        helpText: { type: [string, "null"] }
        placeholder: { type: [string, "null"] }
        options: { type: array, items: { type: string } }
        settings:
          type: object
          additionalProperties: false
          properties:
            minLength: { type: integer }
            maxLength: { type: integer }
            min: { type: number }
            max: { type: number }
            minDate: { type: string, description: YYYY-MM-DD }
            maxDate: { type: string, description: YYYY-MM-DD }
            maxSelections: { type: integer }
            allowOther: { type: boolean }
        showIf:
          type: [object, "null"]
          additionalProperties: false
          required: [fieldKey, values]
          description: Show only when the earlier field `fieldKey` has one of `values` (CHECKBOX answers are "Yes"/"No").
          properties:
            fieldKey: { type: string }
            values: { type: array, items: { type: string } }

    PublicEvent:
      type: object
      additionalProperties: false
      required: [event, registration, schedule, speakers, feedbackOpen, ticketing]
      properties:
        event:
          unevaluatedProperties: false
          allOf:
            - { $ref: "#/components/schemas/EventSummaryFields" }
            - type: object
              required: [description, tags, capacity, showRegistrationCount, confirmedCount, privacyType, registrationOpen, registrationFull, registrationClosedReason, onlineUrl]
              properties:
                description: { type: string }
                tags: { type: array, items: { type: string } }
                capacity: { type: [integer, "null"] }
                showRegistrationCount: { type: boolean }
                confirmedCount: { type: [integer, "null"], description: Null when the organiser hides counts. }
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationFull: { type: boolean }
                registrationClosedReason: { type: [string, "null"] }
                onlineUrl: { type: [string, "null"], description: Always null; no separate joining URL is stored. }
        registration:
          type: object
          additionalProperties: false
          required: [requiresApproval, fields, myRsvp]
          properties:
            requiresApproval: { type: boolean }
            fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }
            myRsvp:
              type: [object, "null"]
              additionalProperties: false
              required: [rsvpId, status, ticketToken]
              properties:
                rsvpId: { type: string }
                status: { $ref: "#/components/schemas/RsvpStatus" }
                ticketToken: { type: [string, "null"] }
        schedule:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [trackName, sessions]
            properties:
              trackName: { type: [string, "null"] }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, startDateTime, endDateTime, delayMinutes, room, speakers]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: Minutes this session is running late; start/end already include it. }
                    room: { type: [string, "null"] }
                    speakers: { type: array, items: { type: string } }
        speakers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, title, photoUrl]
            properties:
              name: { type: string }
              title: { type: [string, "null"] }
              photoUrl: { $ref: "#/components/schemas/NullableUrl" }
        feedbackOpen: { type: boolean }
        ticketing:
          oneOf:
            - { $ref: "#/components/schemas/Ticketing" }
            - { type: "null" }

    RsvpResult:
      oneOf:
        - { $ref: "#/components/schemas/FreeRsvpResult" }
        - { $ref: "#/components/schemas/PaidRsvpResult" }

    FreeRsvpResult:
      type: object
      additionalProperties: false
      required: [rsvpId, status, ticketToken]
      properties:
        rsvpId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL] }
        ticketToken: { type: [string, "null"] }

    PaidRsvpResult:
      type: object
      additionalProperties: false
      required: [rsvpId, status, ticketToken, orderId, checkoutUrl, holdExpiresAt]
      properties:
        rsvpId: { type: [string, "null"] }
        status: { type: string, enum: [PENDING_PAYMENT, PENDING_APPROVAL] }
        ticketToken: { type: "null" }
        orderId: { type: string }
        checkoutUrl: { $ref: "#/components/schemas/NullableUrl" }
        holdExpiresAt: { $ref: "#/components/schemas/NullableDateTime" }

    FeedbackForm:
      type: object
      additionalProperties: false
      required: [title, intro, thankYouMessage, open, certificatesEnabled, fields]
      properties:
        title: { type: string }
        intro: { type: [string, "null"] }
        thankYouMessage: { type: string }
        open: { const: true }
        certificatesEnabled: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }

    EventPermissions:
      type: object
      additionalProperties: false
      required: [checkIn, manageRegistrations, sendEmails, schedule, manageFeedback, manageRegistrationWindow, judge, checkInToLists, manageOrders, manageCrew, fileClaims, manageFinance]
      properties:
        checkIn: { type: boolean }
        manageRegistrations: { type: boolean }
        sendEmails: { type: boolean }
        schedule: { type: boolean }
        manageFeedback: { type: boolean }
        manageRegistrationWindow: { type: boolean }
        judge: { type: boolean, description: Can open the judging workspace (OWNER/ADMIN or the JUDGE grant) on an event with submissions switched on. }
        checkInToLists: { type: boolean, description: Custom check-in lists (CHECK_IN). }
        manageOrders: { type: boolean, description: Paid orders, desk settlement, payment links and refunds (MANAGE_REGISTRATIONS). }
        manageCrew: { type: boolean, description: The event crew and their free crew tickets (MANAGE_REGISTRATIONS). }
        fileClaims: { type: boolean, description: File and withdraw own expense claims (anyone on the event dashboard). }
        manageFinance: { type: boolean, description: Decide claims and refund requests (organisation OWNER/ADMIN). }

    EventCounts:
      type: object
      additionalProperties: false
      required: [confirmed, waitlisted, pending, pendingPayment, crew, checkedIn, capacity, capacityUsed]
      properties:
        confirmed: { type: integer }
        waitlisted: { type: integer }
        pending: { type: integer }
        pendingPayment: { type: integer, description: Paid places held while the buyer pays; they count against capacity. }
        crew: { type: integer, description: Crew tickets (docs/CREW.md); counted in confirmed, never against capacity. }
        checkedIn: { type: integer }
        capacity: { type: [integer, "null"] }
        capacityUsed:
          type: integer
          description: >-
            What capacity is compared with. Equals confirmed on individual
            events; on team events it counts confirmed teams plus confirmed
            solo registrants, while confirmed stays a count of people.

    OrgEvents:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            unevaluatedProperties: false
            allOf:
              - { $ref: "#/components/schemas/EventSummaryFields" }
              - type: object
                required: [counts, myPermissions]
                properties:
                  counts:
                    oneOf:
                      - { $ref: "#/components/schemas/EventCounts" }
                      - { type: "null" }
                  myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    OrgEventDetail:
      type: object
      additionalProperties: false
      required: [event, counts, myPermissions]
      properties:
        event:
          unevaluatedProperties: false
          allOf:
            - { $ref: "#/components/schemas/EventSummaryFields" }
            - type: object
              required: [privacyType, registrationOpen, registrationClosesAt, registrationClosedReason, registrationManuallyClosed, feedbackOpen, eventUrl, shortUrl]
              properties:
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationClosesAt: { $ref: "#/components/schemas/NullableDateTime" }
                registrationClosedReason: { type: [string, "null"] }
                registrationManuallyClosed: { type: boolean, description: Sign-ups were closed from a mobile app and can be reopened there. }
                feedbackOpen: { type: boolean }
                eventUrl: { type: string, format: uri }
                shortUrl: { $ref: "#/components/schemas/NullableUrl" }
        counts:
          oneOf:
            - { $ref: "#/components/schemas/EventCounts" }
            - { type: "null" }
        myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    Guest:
      description: Closed form of GuestFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/GuestFields" }]
      unevaluatedProperties: false

    GuestFields:
      description: The Guest properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [rsvpId, displayName, email, status, checkedInAt, registeredAt, isGuest]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        isGuest: { type: boolean, description: True when the registration has no account. }
        teamName: { type: string, description: TEAM events only; absent for solo registrants. }
        orderId: { type: string, description: The paid order this guest's ticket belongs to. }
        isCrew: { const: true, description: A free crew ticket; present only when true. }
        paymentOutcome: { type: string, enum: [LINK_SENT, REFUNDED], description: "Only in answers to approve, promote, reaccept and reject: a paid place was offered (the ticket confirms once paid) or a paid order refunded." }

    Detail:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    GuestList:
      type: object
      additionalProperties: false
      required: [guests, nextCursor]
      properties:
        guests: { type: array, items: { $ref: "#/components/schemas/Guest" } }
        nextCursor: { type: [string, "null"] }

    GuestDetail:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/GuestFields" }
        - type: object
          required: [answers]
          properties:
            answers: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Undo:
      type: object
      additionalProperties: false
      required: [undoId]
      properties:
        undoId: { type: string }

    CheckInResult:
      description: Closed form of CheckInResultFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/CheckInResultFields" }]
      unevaluatedProperties: false

    CheckInResultFields:
      description: The CheckInResult properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [rsvpId, displayName, email, status, alreadyCheckedIn, checkedInAt, checkInDetails, registrationDetails]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        alreadyCheckedIn: { type: boolean }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
        registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
        teamName: { type: string, description: TEAM events only; absent for solo registrants. }

    CheckInPreview:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/CheckInResultFields" }
        - type: object
          required: [gate, payment]
          properties:
            payment:
              oneOf:
                - { $ref: "#/components/schemas/PaymentInfo" }
                - { type: "null" }
            gate:
              oneOf:
                - { type: object, additionalProperties: false, required: [ok], properties: { ok: { const: true } } }
                - type: object
                  additionalProperties: false
                  required: [ok, reason, needsForce]
                  properties:
                    ok: { const: false }
                    reason: { type: string }
                    needsForce: { type: boolean }
                    blocked: { type: boolean }

    Lookup:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/Guest" } }

    CheckInStats:
      type: object
      additionalProperties: false
      required: [confirmed, checkedIn, recent]
      properties:
        confirmed: { type: integer }
        checkedIn: { type: integer }
        recent:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rsvpId, displayName, checkedInAt]
            properties:
              rsvpId: { type: string }
              displayName: { type: string }
              checkedInAt: { $ref: "#/components/schemas/DateTime" }

    RosterRow:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/GuestFields" }
        - type: object
          required: [ticketToken, checkInDetails, registrationDetails]
          properties:
            ticketToken: { type: string, description: Bearer capability; never log or persist outside the encrypted offline store. }
            checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
            registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Roster:
      type: object
      additionalProperties: false
      required: [generatedAt, rows]
      properties:
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        rows: { type: array, items: { $ref: "#/components/schemas/RosterRow" } }

    SyncResult:
      type: object
      additionalProperties: false
      required: [syncedIds, alreadyCheckedInIds, failed]
      properties:
        syncedIds: { type: array, items: { type: string } }
        alreadyCheckedInIds: { type: array, items: { type: string } }
        failed:
          type: array
          items: { type: object, additionalProperties: false, required: [rsvpId, error], properties: { rsvpId: { type: string }, error: { type: string } } }

    BroadcastAudience:
      type: object
      additionalProperties: false
      required: [statuses]
      properties:
        statuses: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    BroadcastContent:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 20000, description: "Supported HTML subset: p, strong, em, h2, h3, ul, ol, li, blockquote, a, a.cta, br." }
        design: { type: string, enum: [classic, minimal, accent, photo, letter], default: classic }

    BroadcastsMeta:
      type: object
      additionalProperties: false
      required: [templates, designs, placeholders, history]
      properties:
        templates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, group, name, description, subject, bodyHtml, audience]
            properties:
              id: { type: string }
              group: { type: string }
              name: { type: string }
              description: { type: string }
              subject: { type: string }
              bodyHtml: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
        designs:
          type: array
          items: { type: object, additionalProperties: false, required: [id, label, description], properties: { id: { type: string }, label: { type: string }, description: { type: string } } }
        placeholders: { type: array, items: { type: string } }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, subject, design, audience, recipientCount, sentAt, bodyHtml]
            properties:
              id: { type: string }
              subject: { type: string }
              design: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
              recipientCount: { type: integer }
              sentAt: { $ref: "#/components/schemas/DateTime" }
              bodyHtml: { type: string }

    StoredAudience:
      type: object
      additionalProperties: false
      required: [statuses, attendance]
      properties:
        statuses: { type: array, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    ScheduleSpeaker:
      type: object
      additionalProperties: false
      required: [id, name, headline, organisation, photoUrl]
      properties:
        id: { type: string }
        name: { type: string }
        headline: { type: [string, "null"] }
        organisation: { type: [string, "null"] }
        photoUrl: { type: [string, "null"], description: Absolute URL }

    Schedule:
      type: object
      additionalProperties: false
      required: [generatedAt, tracks]
      properties:
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        tracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, sessions]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, type, visibility, startDateTime, endDateTime, delayMinutes, effectiveStartDateTime, effectiveEndDateTime, speakers]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    type: { type: string, description: "Session type label, for example Talk or Workshop" }
                    visibility: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN] }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: The session's stored live delay (what the delay control sets); planned times are unchanged. }
                    effectiveStartDateTime: { $ref: "#/components/schemas/DateTime", description: "Planned start shifted by the delays of earlier sessions in the same track (as on the public page)" }
                    effectiveEndDateTime: { $ref: "#/components/schemas/DateTime" }
                    speakers: { type: array, items: { $ref: "#/components/schemas/ScheduleSpeaker" } }

    # Success envelopes
    OrganiserTeam:
      type: object
      additionalProperties: false
      required: [id, name, status, size, minSize, maxSize, incomplete, lookingForMembers, leaderDisplayName, members]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        size: { type: integer }
        minSize: { type: [integer, "null"] }
        maxSize: { type: [integer, "null"] }
        incomplete: { type: boolean, description: Below the minimum team size; cannot be approved. }
        lookingForMembers: { type: boolean }
        leaderDisplayName: { type: [string, "null"] }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rsvpId, displayName, isLeader, checkedIn]
            properties:
              rsvpId: { type: string, description: Use with the guest routes (detail, check-in). }
              displayName: { type: string }
              isLeader: { type: boolean }
              checkedIn: { type: boolean }

    TeamList:
      type: object
      additionalProperties: false
      required: [teams, nextCursor, counts]
      properties:
        teams: { type: array, items: { $ref: "#/components/schemas/OrganiserTeam" } }
        nextCursor: { type: [string, "null"] }
        counts:
          type: object
          additionalProperties: false
          required: [ALL, CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED, INCOMPLETE, LOOKING]
          properties:
            ALL: { type: integer }
            CONFIRMED: { type: integer }
            WAITLISTED: { type: integer }
            PENDING_APPROVAL: { type: integer }
            REJECTED: { type: integer }
            INCOMPLETE: { type: integer }
            LOOKING: { type: integer }

    JudgingCriterion:
      type: object
      additionalProperties: false
      required: [id, name, description, weight, maxScore]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        weight: { type: integer, minimum: 1, maximum: 10 }
        maxScore: { type: integer, minimum: 1, maximum: 10 }

    ScoreInput:
      type: object
      additionalProperties: false
      required: [criterionId, score]
      properties:
        criterionId: { type: string }
        score: { type: integer, minimum: 0, description: "0..the criterion's maxScore." }

    MyReview:
      type: object
      additionalProperties: false
      required: [status, scoredCriteria]
      properties:
        status: { $ref: "#/components/schemas/ReviewStatus" }
        scoredCriteria: { type: integer }

    JudgeSubmission:
      type: object
      additionalProperties: false
      description: Project content and display names only; never entrant emails, answers, ticket links, disqualification reasons or other judges' scores.
      required: [id, title, summary, links, entrantName, myReview]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string, description: Plain text. }
        links:
          type: object
          additionalProperties: false
          required: [repo, demo, video]
          properties:
            repo: { $ref: "#/components/schemas/NullableUrl" }
            demo: { $ref: "#/components/schemas/NullableUrl" }
            video: { $ref: "#/components/schemas/NullableUrl" }
        entrantName: { type: string, description: Team name, or a solo entrant's first name and last initial. }
        teamName: { type: string, description: Present only for a team entrant. }
        myReview: { $ref: "#/components/schemas/MyReview" }

    JudgeSubmissionList:
      type: object
      additionalProperties: false
      required: [judgingStatus, submissions, nextCursor, counts]
      properties:
        judgingStatus: { $ref: "#/components/schemas/JudgingStatus" }
        submissions: { type: array, items: { $ref: "#/components/schemas/JudgeSubmission" } }
        nextCursor: { type: [string, "null"] }
        counts:
          type: object
          additionalProperties: false
          required: [all, todo, inProgress, reviewed]
          properties:
            all: { type: integer }
            todo: { type: integer, description: No submitted review yet (includes inProgress). }
            inProgress: { type: integer }
            reviewed: { type: integer }

    JudgingCriteria:
      type: object
      additionalProperties: false
      required: [judgingStatus, criteria]
      properties:
        judgingStatus: { $ref: "#/components/schemas/JudgingStatus" }
        criteria: { type: array, items: { $ref: "#/components/schemas/JudgingCriterion" } }

    JudgeSubmissionDetail:
      type: object
      additionalProperties: false
      required: [judgingStatus, criteria, submission, myScores, myComment, mySubmittedAt]
      properties:
        judgingStatus: { $ref: "#/components/schemas/JudgingStatus" }
        criteria: { type: array, items: { $ref: "#/components/schemas/JudgingCriterion" } }
        submission: { $ref: "#/components/schemas/JudgeSubmission" }
        myScores:
          type: array
          items: { type: object, additionalProperties: false, required: [criterionId, score], properties: { criterionId: { type: string }, score: { type: integer } } }
        myComment: { type: [string, "null"], description: This judge's own private comment. }
        mySubmittedAt: { $ref: "#/components/schemas/NullableDateTime" }

    JudgeNext:
      type: object
      additionalProperties: false
      required: [next, remaining]
      properties:
        next:
          oneOf:
            - { $ref: "#/components/schemas/JudgeSubmissionDetail" }
            - { type: "null" }
        remaining: { type: integer }

    JudgeScoresSaved:
      type: object
      additionalProperties: false
      required: [scored, total, myReview]
      properties:
        scored: { type: integer }
        total: { type: integer }
        myReview: { $ref: "#/components/schemas/MyReview" }

    SessionResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Session" } } }
    AuthConfigResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/AuthConfig" } } }
    MeResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Me" } } }
    UserResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/User" } } }
    RegistrationsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Registrations" } } }
    EventListResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/EventList" } } }
    ShortLinkResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/ShortLink" } } }
    PublicEventResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/PublicEvent" } } }
    FeedbackFormResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/FeedbackForm" } } }
    RsvpResultResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/RsvpResult" } } }
    OrgEventsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/OrgEvents" } } }
    OrgEventDetailResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/OrgEventDetail" } } }
    GuestListResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/GuestList" } } }
    GuestResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Guest" } } }
    GuestDetailResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/GuestDetail" } } }
    UndoResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Undo" } } }
    CheckInResultResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInResult" } } }
    CheckInPreviewResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInPreview" } } }
    LookupResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Lookup" } } }
    CheckInStatsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/CheckInStats" } } }
    RosterResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Roster" } } }
    SyncResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/SyncResult" } } }
    BroadcastsMetaResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/BroadcastsMeta" } } }
    BroadcastCountResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [count], properties: { count: { type: integer } } } } }
    BroadcastPreviewResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [subject, html, text], properties: { subject: { type: string }, html: { type: string }, text: { type: string } } } } }
    BroadcastTestResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [to], properties: { to: { type: string } } } } }
    BroadcastSendResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [broadcastId, recipientCount], properties: { broadcastId: { type: string }, recipientCount: { type: integer } } } } }
    ScheduleResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/Schedule" } } }
    FeedbackStateResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: object, additionalProperties: false, required: [open], properties: { open: { type: boolean } } } } }
    RegistrationState:
      type: object
      additionalProperties: false
      required: [registrationOpen, registrationClosesAt, registrationClosedReason, registrationManuallyClosed]
      properties:
        registrationOpen: { type: boolean }
        registrationClosesAt: { $ref: "#/components/schemas/NullableDateTime" }
        registrationClosedReason: { type: [string, "null"], description: UI-safe reason when registration is closed. }
        registrationManuallyClosed: { type: boolean }
    RegistrationStateResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/RegistrationState" } } }
    MyTeamResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/MyTeamResult" } } }
    TeamListResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/TeamList" } } }

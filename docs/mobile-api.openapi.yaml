              required: [id, status, attendance, checkedInAt, checkedOutAt, minutes, hoursState]
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/VolunteerSignupStatus" }
                attendance: { $ref: "#/components/schemas/VolunteerAttendance" }
                checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
                checkedOutAt: { $ref: "#/components/schemas/NullableDateTime" }
                minutes: { type: [integer, "null"] }
                hoursState: { oneOf: [{ $ref: "#/components/schemas/VolunteerHoursState" }, { type: "null" }] }
    MyShifts:
      type: object
      additionalProperties: false
      required: [timeZone, verifiedMinutes, certificateUrl, shifts]
      properties:
        timeZone: { type: string }
        verifiedMinutes: { type: integer }
        certificateUrl: { $ref: "#/components/schemas/NullableUrl" }
        shifts: { type: array, items: { $ref: "#/components/schemas/MyShift" } }
    MyShiftsResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { oneOf: [{ $ref: "#/components/schemas/MyShifts" }, { type: "null" }] } } }
    RosterSignup:
      type: object
      additionalProperties: false
      required: [id, crewMemberId, name, kind, status, attendance, queuedAt, checkedInAt, checkedOutAt, breakMinutes, hours, isViewer]
      properties:
        id: { type: string }
        crewMemberId: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CrewKind" }
        status: { $ref: "#/components/schemas/VolunteerSignupStatus" }
        attendance: { $ref: "#/components/schemas/VolunteerAttendance" }
        queuedAt: { type: string, format: date-time }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        checkedOutAt: { $ref: "#/components/schemas/NullableDateTime" }
        breakMinutes: { type: integer }
        hours:
          oneOf:
            - type: "null"
            - { type: object, additionalProperties: false, required: [id, minutes, state], properties: { id: { type: string }, minutes: { type: integer }, state: { $ref: "#/components/schemas/VolunteerHoursState" } } }
        isViewer: { type: boolean, description: The caller's own sign-up; they cannot verify these hours. }
    RosterShift:
      type: object
      additionalProperties: false
      required: [id, title, zone, task, startsAt, endsAt, signupDeadline, graceMinutes, requiresApproval, capacity, waitlistEnabled, closed, approved, signups]
      properties:
        id: { type: string }
        title: { type: string }
        zone: { type: string }
        task: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        signupDeadline: { type: string, format: date-time }
        graceMinutes: { type: integer }
        requiresApproval: { type: boolean }
        capacity: { type: integer, description: 0 means no limit. }
        waitlistEnabled: { type: boolean }
        closed: { type: boolean }
        approved: { type: integer }
        signups: { type: array, items: { $ref: "#/components/schemas/RosterSignup" } }
    Contributor:
      type: object
      additionalProperties: false
      required: [crewMemberId, name, kind, role, verifiedMinutes, pendingHours, certificate, eligible, isViewer, claims]
      properties:
        crewMemberId: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CrewKind" }
        role: { type: string }
        verifiedMinutes: { type: integer }
        pendingHours: { type: integer }
        certificate: { oneOf: [{ type: "null" }, { type: object, additionalProperties: false, required: [issuedAt], properties: { issuedAt: { type: string, format: date-time } } }] }
        eligible: { type: boolean }
        isViewer: { type: boolean }
        claims: { type: object, additionalProperties: false, required: [open, total], properties: { open: { type: integer }, total: { type: integer } } }
    VolunteerRoster:
      type: object
      additionalProperties: false
      required: [enabled, isAdmin, timeZone, shifts, contributors]
      properties:
        enabled: { type: boolean }
        isAdmin: { type: boolean, description: May verify and adjust hours. }
        timeZone: { type: string }
        shifts: { type: array, items: { $ref: "#/components/schemas/RosterShift" } }
        contributors: { type: array, items: { $ref: "#/components/schemas/Contributor" } }
    VolunteerRosterResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/VolunteerRoster" } } }
    VolunteerSignupWrite:
      type: object
      additionalProperties: false
      required: [signupId, status, attendance, minutes]
      properties:
        signupId: { type: string }
        status: { $ref: "#/components/schemas/VolunteerSignupStatus" }
        attendance: { $ref: "#/components/schemas/VolunteerAttendance" }
        minutes: { type: [integer, "null"], description: Pending or verified minutes once checked out. }
    VolunteerSignupWriteResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/VolunteerSignupWrite" } } }
    VolunteerHoursWrite:
      type: object
      additionalProperties: false
      required: [hoursId, state, minutes, revokedCertificate]
      properties:
        hoursId: { type: string }
        state: { $ref: "#/components/schemas/VolunteerHoursState" }
        minutes: { type: integer }
        revokedCertificate: { type: boolean, description: An issued certificate was revoked because the hours changed. }
    VolunteerHoursWriteResponse: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { $ref: "#/components/schemas/VolunteerHoursWrite" } } }

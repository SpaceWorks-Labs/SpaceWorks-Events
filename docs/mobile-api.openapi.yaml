        default: { $ref: "#/components/responses/Error" }

  /api/mobile/v1/me/registrations/{rsvpId}/application:
    get:
      tags: [Applications]
      summary: The caller's own application
      description: |
        Applications (docs/ADMISSION.md) for one of the caller's own
        registrations, through the app session (the ticket token is never
        needed or returned): status, stage, the offer's answer-by time, the
        actions allowed now, payment state, and the caller's answers while
        still editable. `{ "application": null }` when the registration isn't
        an application; anyone else's registration is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyApplicationResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/me/registrations/{rsvpId}/application/respond:
    post:
      tags: [Applications]
      summary: Accept, decline or withdraw
      description: |
        The same rules as the ticket page: the team leader answers for a team;
        accept and decline only while offered (before its answer-by time);
        withdraw while in review, waitlisted or offered. A free place is
        confirmed at once. A paid place is never confirmed unpaid: it is held
        while it is paid and `checkoutUrl` opens the hosted payment page; poll
        GET .../application until it is accepted.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: "One per user action; a retry with the same key and body replays the first answer." }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [response], properties: { response: { type: string, enum: [accept, decline, withdraw] } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationRespondResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/me/registrations/{rsvpId}/application/answers:
    put:
      tags: [Applications]
      summary: Edit the caller's answers
      description: |
        While the application is in review and before the first released
        decision, with the registration form's validation. The replaced
        answers are kept and reviews of them stop counting.
      parameters: [{ $ref: "#/components/parameters/rsvpId" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: "One per user action; a retry with the same key and body replays the first answer." }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [answers], properties: { answers: { type: object, description: "By field key, as when registering." } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyApplicationResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/applications/summary:
    get:
      tags: [Applications]
      summary: Application counts (read-only)
      description: |
        Counts by status and by stage, offers out against the limit, the
        waitlist and drafted decisions. OWNER/ADMIN or MANAGE_REGISTRATIONS
        (`myPermissions.manageApplications`), as the Applications tab.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationsSummaryResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/applications/reviews:
    get:
      tags: [Applications]
      summary: The caller's review assignments
      description: |
        Reviewers only (REVIEW_APPLICATIONS or OWNER/ADMIN), behind the staff
        authenticator; anyone else, or an event not taking applications, is
        `NOT_FOUND`. Open stages first.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueueResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/applications/reviews/{assignmentId}:
    get:
      tags: [Applications]
      summary: One assigned application
      description: |
        As the stage allows: a blind stage has no names, email addresses,
        phone numbers or team name. Another reviewer's assignment, a recused
        one, or one the caller may no longer review (off the panel, a
        conflict) is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: assignmentId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItemResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Applications]
      summary: Submit the review
      description: Every criterion (or "overall") scored 1 to 5, and notes for the organisers. Final once submitted; only while the stage is open.
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: assignmentId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: "One per user action; a retry with the same key and body replays the first answer." }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scores, notes]
              properties:
                scores: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 5 } }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewWriteResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/mobile/v1/orgs/{orgSlug}/events/{eventId}/applications/reviews/{assignmentId}/recuse:
    post:
      tags: [Applications]
      summary: Step back (a conflict of interest)
      description: Only before reviewing. Recorded; the least-loaded reviewer left on the stage's panel takes it (`replaced`).
      parameters: [{ $ref: "#/components/parameters/orgSlug" }, { $ref: "#/components/parameters/eventId" }, { name: assignmentId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: "One per user action; a retry with the same key and body replays the first answer." }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewWriteResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token from a `Session` (prefix `swa_`, 15 minutes). Refresh once on 401, then sign out."

  parameters:
    orgSlug: { name: orgSlug, in: path, required: true, schema: { type: string } }
    eventSlug: { name: eventSlug, in: path, required: true, schema: { type: string } }
    eventId: { name: eventId, in: path, required: true, schema: { type: string } }
    rsvpId: { name: rsvpId, in: path, required: true, schema: { type: string } }
    teamId: { name: teamId, in: path, required: true, schema: { type: string } }
    submissionId: { name: submissionId, in: path, required: true, schema: { type: string } }
    orderId: { name: orderId, in: path, required: true, schema: { type: string } }
    claimId: { name: claimId, in: path, required: true, schema: { type: string } }
    receiptId: { name: receiptId, in: path, required: true, schema: { type: string } }
    listId: { name: listId, in: path, required: true, schema: { type: string } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string } }
    instanceId: { name: instanceId, in: path, required: true, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 }, description: "One per user action. A retry with the same key, path and body replays the first answer (`Idempotent-Replayed: true`, ticket tokens left out) without acting twice; the same key on another path or body is CONFLICT." }

  responses:
    Error:
      description: >-
        Error envelope (docs/MOBILE_API.md). Any status an operation does not
        list, such as 400 `INVALID_REQUEST`, 401 `UNAUTHENTICATED`, 404
        `NOT_FOUND` or 429 `RATE_LIMITED`, uses this envelope; so does an
        unknown path under /api/mobile/v1.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NullData:
      description: OK
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [ok, data], properties: { ok: { const: true }, data: { type: "null" } } }
    Session:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } }

  schemas:
    Platform: { type: string, enum: [android, ios] }
    RsvpStatus: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED, PENDING_PAYMENT], description: "PENDING_PAYMENT: a paid place held while the buyer pays; never a ticket until paid." }
    DeviceId: { type: string, pattern: "^[a-f0-9]{32,64}$", description: "The app install's own random id, kept for the life of the install. Only its SHA-256 is stored." }
    EventStatus: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN, CANCELLED] }
    PrivacyType: { type: string, enum: [PUBLIC, HIDDEN_LINK, APPROVAL_REQUIRED, INVITE_ONLY] }
    MembershipRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
    EventPermission: { type: string, enum: [EDIT_DETAILS, MANAGE_REGISTRATIONS, MANAGE_INVITATIONS, CHECK_IN, PUBLISH_AND_SCHEDULE, JUDGE, MENTOR] }
    FieldType: { type: string, enum: [TEXT, TEXTAREA, EMAIL, PHONE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, NUMBER, DATE] }
    Attendance: { type: string, enum: [ANY, CHECKED_IN, NOT_CHECKED_IN], default: ANY }
    RegistrationMode: { type: string, enum: [INDIVIDUAL, TEAM], description: "TEAM: capacity counts teams plus solo registrants (\"teams & solo places\")." }
    JudgingStatus: { type: string, enum: [NOT_STARTED, OPEN, CLOSED] }
    ReviewStatus: { type: string, enum: [NONE, DRAFT, SUBMITTED], description: "SUBMITTED once submitted; DRAFT once any score or comment is saved." }
    DateTime: { type: string, format: date-time }
    NullableDateTime: { type: [string, "null"], format: date-time }
    NullableUrl: { type: [string, "null"], format: uri }

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, MFA_REQUIRED, EMAIL_VERIFICATION_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, NEEDS_FORCE, RATE_LIMITED, TEAM_REQUIRED, TEAM_MEMBER, TEAM_INCOMPLETE, CAPACITY_FULL, JUDGING_CLOSED, INCOMPLETE_SCORES, NOT_VISIBLE, INTERNAL_ERROR, STAFF_MFA_REQUIRED, STAFF_MFA_ENROLMENT_REQUIRED, EMAIL_CODE_REQUIRED, TOO_MANY_ATTEMPTS, REAUTH_REQUIRED, PAID_ORDER, REGISTRATION_CLOSED, PAYMENT_UNAVAILABLE, PAYLOAD_TOO_LARGE, IDEMPOTENCY_STALE, ADMISSION_MANAGED, OPEN_CLAIMS] }
            message: { type: string, description: UI-safe text. }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, imageUrl, emailVerified, mfaEnabled]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        imageUrl: { $ref: "#/components/schemas/NullableUrl" }
        emailVerified: { type: boolean }
        mfaEnabled: { type: boolean }

    Session:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { $ref: "#/components/schemas/DateTime" }
        user: { $ref: "#/components/schemas/User" }

    AuthConfig:
      type: object
      additionalProperties: false
      required: [instanceName, googleSignIn, signupEnabled, paidEventsEnabled, baseUrl]
      properties:
        instanceName: { type: string }
        googleSignIn:
          type: object
          additionalProperties: false
          required: [enabled, webClientId]
          properties:
            enabled: { type: boolean }
            webClientId: { type: [string, "null"] }
        signupEnabled: { type: boolean }
        paidEventsEnabled: { type: boolean, description: Paid tickets are switched on for this installation. }
        baseUrl: { type: string, format: uri }

    OrgSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, logoUrl, role]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        logoUrl: { $ref: "#/components/schemas/NullableUrl" }
        role: { $ref: "#/components/schemas/MembershipRole" }

    Collaboration:
      type: object
      additionalProperties: false
      required: [organisation, eventId, eventTitle, permissions]
      properties:
        organisation: { type: object, additionalProperties: false, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        eventId: { type: string }
        eventTitle: { type: string }
        permissions: { type: array, items: { $ref: "#/components/schemas/EventPermission" } }

    JudgingEvent:
      type: object
      additionalProperties: false
      description: An event the caller judges through a JUDGE grant, once it takes submissions. Organisation admins use `myPermissions.judge` on the org event list.
      required: [organisation, eventId, eventTitle, startDateTime, endDateTime, timezone, judgingStatus]
      properties:
        organisation: { type: object, additionalProperties: false, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        eventId: { type: string }
        eventTitle: { type: string }
        startDateTime: { $ref: "#/components/schemas/DateTime" }
        endDateTime: { $ref: "#/components/schemas/DateTime" }
        timezone: { type: string }
        judgingStatus: { $ref: "#/components/schemas/JudgingStatus" }

    Me:
      type: object
      additionalProperties: false
      required: [user, organisations, collaborations, judging, mentoring, staffMfa]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organisations: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
        collaborations: { type: array, items: { $ref: "#/components/schemas/Collaboration" } }
        judging: { type: array, items: { $ref: "#/components/schemas/JudgingEvent" } }
        mentoring: { type: array, items: { $ref: "#/components/schemas/MentoringEvent" }, description: Events this user mentors while their Mentor Desk is on. }
        staffMfa: { type: string, enum: [ok, verify, enrol], description: "The staff authenticator rule for this app session: verify (POST /auth/mfa) or enrol (on the website). Attendees are always ok." }

    EventSummary:
      description: Closed form of EventSummaryFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/EventSummaryFields" }]
      unevaluatedProperties: false

    EventSummaryFields:
      description: The EventSummary properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [id, slug, title, coverImageUrl, startDateTime, endDateTime, timezone, location, mapLinkUrl, isOnline, accentColor, status, registrationMode, organisation]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        coverImageUrl: { $ref: "#/components/schemas/NullableUrl" }
        startDateTime: { $ref: "#/components/schemas/DateTime" }
        endDateTime: { $ref: "#/components/schemas/DateTime" }
        timezone: { type: string, description: IANA time zone. }
        location: { type: string }
        mapLinkUrl: { type: [string, "null"] }
        isOnline: { type: boolean }
        accentColor: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        registrationMode: { $ref: "#/components/schemas/RegistrationMode" }
        organisation:
          type: object
          additionalProperties: false
          required: [slug, name, logoUrl]
          properties:
            slug: { type: string }
            name: { type: string }
            logoUrl: { $ref: "#/components/schemas/NullableUrl" }

    EventList:
      type: object
      additionalProperties: false
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } }
        nextCursor: { type: [string, "null"] }

    Registration:
      type: object
      additionalProperties: false
      required: [rsvpId, status, checkedInAt, registeredAt, canCancel, ticketToken, orderId, event, instanceId]
      properties:
        rsvpId: { type: string }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        canCancel: { type: boolean }
        ticketToken: { type: [string, "null"], description: Only for CONFIRMED registrations. }
        orderId: { type: [string, "null"], description: "The paid order this registration belongs to (GET /me/orders/{orderId})." }
        isCrew: { const: true, description: The caller's free crew ticket; present only when true. }
        event: { $ref: "#/components/schemas/EventSummary" }
        instanceId: { type: [string, "null"], description: Set for a recurring-series occurrence; `event` then describes the series. }
        team: { $ref: "#/components/schemas/MyTeam" }

    MyTeam:
      type: object
      additionalProperties: false
      description: The caller's own team (present only for a registration in a team). Names only.
      required: [id, name, role, size, maxSize, members]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [LEADER, MEMBER], description: The caller's role. }
        size: { type: integer }
        maxSize: { type: [integer, "null"] }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [displayName, isLeader]
            properties:
              displayName: { type: string, description: First name and last initial. }
              isLeader: { type: boolean }

    MyTeamResult:
      type: object
      additionalProperties: false
      required: [team, order]
      properties:
        team:
          oneOf:
            - { $ref: "#/components/schemas/MyTeam" }
            - { type: "null" }
        order:
          type: [object, "null"]
          additionalProperties: false
          required: [orderId, status, holdExpiresAt]
          description: The caller's order for a paid team place, if any.
          properties:
            orderId: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
            holdExpiresAt: { $ref: "#/components/schemas/NullableDateTime" }

    Registrations:
      type: object
      additionalProperties: false
      required: [upcoming, past, certificates]
      properties:
        upcoming: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        past: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        certificates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [eventTitle, organisationName, issuedAt, certificateUrl]
            properties:
              eventTitle: { type: string }
              organisationName: { type: string }
              issuedAt: { $ref: "#/components/schemas/DateTime" }
              certificateUrl: { type: string, format: uri }

    ShortLink:
      type: object
      additionalProperties: false
      required: [orgSlug, eventSlug]
      properties:
        orgSlug: { type: string }
        eventSlug: { type: string }

    RegistrationField:
      type: object
      additionalProperties: false
      required: [id, key, label, type, required, helpText, placeholder, options, settings, showIf]
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/FieldType" }
        required: { type: boolean }
        helpText: { type: [string, "null"] }
        placeholder: { type: [string, "null"] }
        options: { type: array, items: { type: string } }
        settings:
          type: object
          additionalProperties: false
          properties:
            minLength: { type: integer }
            maxLength: { type: integer }
            min: { type: number }
            max: { type: number }
            minDate: { type: string, description: YYYY-MM-DD }
            maxDate: { type: string, description: YYYY-MM-DD }
            maxSelections: { type: integer }
            allowOther: { type: boolean }
        showIf:
          type: [object, "null"]
          additionalProperties: false
          required: [fieldKey, values]
          description: Show only when the earlier field `fieldKey` has one of `values` (CHECKBOX answers are "Yes"/"No").
          properties:
            fieldKey: { type: string }
            values: { type: array, items: { type: string } }

    PublicEvent:
      type: object
      additionalProperties: false
      required: [event, registration, schedule, speakers, feedbackOpen, ticketing]
      properties:
        event:
          unevaluatedProperties: false
          allOf:
            - { $ref: "#/components/schemas/EventSummaryFields" }
            - type: object
              required: [description, tags, capacity, showRegistrationCount, confirmedCount, privacyType, registrationOpen, registrationFull, registrationClosedReason, onlineUrl]
              properties:
                description: { type: string }
                tags: { type: array, items: { type: string } }
                capacity: { type: [integer, "null"] }
                showRegistrationCount: { type: boolean }
                confirmedCount: { type: [integer, "null"], description: Null when the organiser hides counts. }
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationFull: { type: boolean }
                registrationClosedReason: { type: [string, "null"] }
                onlineUrl: { type: [string, "null"], description: Always null; no separate joining URL is stored. }
        registration:
          type: object
          additionalProperties: false
          required: [requiresApproval, takesApplications, fields, myRsvp]
          properties:
            requiresApproval: { type: boolean }
            takesApplications: { type: boolean, description: "Applications (docs/ADMISSION.md): registering means applying; show Apply." }
            fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }
            myRsvp:
              type: [object, "null"]
              additionalProperties: false
              required: [rsvpId, status, ticketToken]
              properties:
                rsvpId: { type: string }
                status: { $ref: "#/components/schemas/RsvpStatus" }
                ticketToken: { type: [string, "null"] }
        schedule:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [trackName, sessions]
            properties:
              trackName: { type: [string, "null"] }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, startDateTime, endDateTime, delayMinutes, room, speakers]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: Minutes this session is running late; start/end already include it. }
                    room: { type: [string, "null"] }
                    speakers: { type: array, items: { type: string } }
        speakers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, title, photoUrl]
            properties:
              name: { type: string }
              title: { type: [string, "null"] }
              photoUrl: { $ref: "#/components/schemas/NullableUrl" }
        feedbackOpen: { type: boolean }
        ticketing:
          oneOf:
            - { $ref: "#/components/schemas/Ticketing" }
            - { type: "null" }

    RsvpResult:
      oneOf:
        - { $ref: "#/components/schemas/FreeRsvpResult" }
        - { $ref: "#/components/schemas/PaidRsvpResult" }

    FreeRsvpResult:
      type: object
      additionalProperties: false
      required: [rsvpId, status, ticketToken]
      properties:
        rsvpId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLISTED, PENDING_APPROVAL] }
        ticketToken: { type: [string, "null"] }

    PaidRsvpResult:
      type: object
      additionalProperties: false
      required: [rsvpId, status, ticketToken, orderId, checkoutUrl, holdExpiresAt]
      properties:
        rsvpId: { type: [string, "null"] }
        status: { type: string, enum: [PENDING_PAYMENT, PENDING_APPROVAL] }
        ticketToken: { type: "null" }
        orderId: { type: string }
        checkoutUrl: { $ref: "#/components/schemas/NullableUrl" }
        holdExpiresAt: { $ref: "#/components/schemas/NullableDateTime" }

    FeedbackForm:
      type: object
      additionalProperties: false
      required: [title, intro, thankYouMessage, open, certificatesEnabled, fields]
      properties:
        title: { type: string }
        intro: { type: [string, "null"] }
        thankYouMessage: { type: string }
        open: { const: true }
        certificatesEnabled: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/RegistrationField" } }

    EventPermissions:
      type: object
      additionalProperties: false
      required: [checkIn, manageRegistrations, sendEmails, schedule, manageFeedback, manageRegistrationWindow, judge, checkInToLists, manageOrders, manageCrew, fileClaims, manageFinance, manageApplications, reviewApplications]
      properties:
        checkIn: { type: boolean }
        manageRegistrations: { type: boolean }
        sendEmails: { type: boolean }
        schedule: { type: boolean }
        manageFeedback: { type: boolean }
        manageRegistrationWindow: { type: boolean }
        judge: { type: boolean, description: Can open the judging workspace (OWNER/ADMIN or the JUDGE grant) on an event with submissions switched on. }
        checkInToLists: { type: boolean, description: Custom check-in lists (CHECK_IN). }
        manageOrders: { type: boolean, description: Paid orders, desk settlement, payment links and refunds (MANAGE_REGISTRATIONS). }
        manageCrew: { type: boolean, description: The event crew and their free crew tickets (MANAGE_REGISTRATIONS). }
        fileClaims: { type: boolean, description: File and withdraw own expense claims (anyone on the event dashboard). }
        manageFinance: { type: boolean, description: Decide claims and refund requests (organisation OWNER/ADMIN). }
        manageApplications: { type: boolean, description: "Applications (docs/ADMISSION.md), on an event taking them: the summary (OWNER/ADMIN or MANAGE_REGISTRATIONS)." }
        reviewApplications: { type: boolean, description: "Applications: the review workspace (OWNER/ADMIN or REVIEW_APPLICATIONS)." }

    EventCounts:
      type: object
      additionalProperties: false
      required: [confirmed, waitlisted, pending, pendingPayment, crew, checkedIn, capacity, capacityUsed, attendance, applications]
      properties:
        confirmed: { type: integer }
        waitlisted: { type: integer }
        pending: { type: integer }
        pendingPayment: { type: integer, description: Paid places held while the buyer pays; they count against capacity. }
        crew: { type: integer, description: Crew tickets (docs/CREW.md); counted in confirmed, never against capacity. }
        checkedIn: { type: integer }
        capacity: { type: [integer, "null"] }
        capacityUsed:
          type: integer
          description: >-
            What capacity is compared with. Equals confirmed on individual
            events; on team events it counts confirmed teams plus confirmed
            solo registrants, while confirmed stays a count of people.
        attendance:
          description: >-
            Attendance confirmation replies (docs/ATTENDANCE.md). Only for
            viewers with sendEmails, like the dashboard Overview line; null
            otherwise and until anyone at the event was asked.
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/AttendanceCounts" }
        applications:
          description: Applications (docs/ADMISSION.md). Only for viewers with manageApplications, on an event taking applications; null otherwise.
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/ApplicationCounts" }

    AdmissionStatus: { type: string, enum: [IN_REVIEW, OFFERED, WAITLISTED, ACCEPTED, REJECTED, DECLINED, EXPIRED, WITHDRAWN] }

    MyApplication:
      type: object
      additionalProperties: false
      required: [status, statusLabel, stage, respondBy, teamName, isLeader, actions, paid, paying, answers]
      properties:
        status: { $ref: "#/components/schemas/AdmissionStatus" }
        statusLabel: { type: string }
        stage:
          oneOf:
            - { type: "null" }
            - { type: object, additionalProperties: false, required: [name, position], properties: { name: { type: string }, position: { type: integer } } }
        respondBy: { type: [string, "null"], format: date-time, description: While offered, answer by then. }
        teamName: { type: [string, "null"] }
        isLeader: { type: boolean, description: Solo applicant or team leader; answers the offer and withdraws. }
        actions: { type: array, items: { type: string, enum: [accept, decline, withdraw] } }
        paid: { type: boolean, description: Accepting costs money; the place is confirmed only once paid. }
        paying: { type: boolean, description: A payment hold for this place is live. }
        answers:
          type: [array, "null"]
          description: The caller's answers while editable; null otherwise.
          items:
            type: object
            additionalProperties: false
            required: [key, label, type, required, options, value, values]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [TEXT, TEXTAREA, EMAIL, PHONE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, NUMBER, DATE] }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
              value: { type: string }
              values: { type: array, items: { type: string } }

    MyApplicationResult:
      type: object
      additionalProperties: false
      required: [application]
      properties:
        application:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/MyApplication" }

    ApplicationRespond:
      type: object
      additionalProperties: false
      required: [status, paying, checkoutUrl]
      properties:
        status: { $ref: "#/components/schemas/AdmissionStatus" }
        paying: { type: boolean }
        checkoutUrl: { type: [string, "null"], format: uri, description: A paid acceptance's hosted payment page. }

    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [assignmentId, stageName, stagePosition, stageOpen, label, status, reviewedCurrent]
      properties:
        assignmentId: { type: string }
        stageName: { type: string }
        stagePosition: { type: integer }
        stageOpen: { type: boolean }
        label: { type: string, description: The applicant or team name; "Application n" on a blind stage. }
        status: { type: string, enum: [ASSIGNED, SUBMITTED, RECUSED] }
        reviewedCurrent: { type: boolean }

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [reviews]
      properties:
        reviews: { type: array, items: { $ref: "#/components/schemas/ReviewQueueItem" } }

    ReviewItem:
      type: object
      additionalProperties: false
      required: [assignmentId, stageName, stageOpen, blind, criteria, guidance, teamName, people, reviewed, canReview]
      properties:
        assignmentId: { type: string }
        stageName: { type: string }
        stageOpen: { type: boolean }
        blind: { type: boolean }
        criteria: { type: array, items: { type: string } }
        guidance: { type: string }
        teamName: { type: [string, "null"] }
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, email, isLeader, answers]
            properties:
              name: { type: string }
              email: { type: [string, "null"], description: Null on a blind stage. }
              isLeader: { type: boolean }
              answers: { type: array, items: { type: object, additionalProperties: false, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }
        reviewed:
          oneOf:
            - { type: "null" }
            - { type: object, additionalProperties: false, required: [scores, notes], properties: { scores: { type: object, additionalProperties: { type: integer } }, notes: { type: string } } }
        canReview: { type: boolean }

    ReviewWrite:
      type: object
      additionalProperties: false
      required: [assignmentId, outcome, replaced]
      properties:
        assignmentId: { type: string }
        outcome: { type: string, enum: [SUBMITTED, RECUSED] }
        replaced: { type: [boolean, "null"] }

    ApplicationCounts:
      type: object
      additionalProperties: false
      required: [total, byStatus, offersOut, offersLimit]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: false
          required: [IN_REVIEW, OFFERED, WAITLISTED, ACCEPTED, REJECTED, DECLINED, EXPIRED, WITHDRAWN]
          properties:
            IN_REVIEW: { type: integer }
            OFFERED: { type: integer }
            WAITLISTED: { type: integer }
            ACCEPTED: { type: integer }
            REJECTED: { type: integer }
            DECLINED: { type: integer }
            EXPIRED: { type: integer }
            WITHDRAWN: { type: integer }
        offersOut: { type: integer, description: Offered plus accepted. }
        offersLimit: { type: [integer, "null"], description: The offer capacity, else the event capacity, else none. }

    ApplicationsSummary:
      type: object
      additionalProperties: false
      required: [enabled, mode, counts, stages, waitlist, draftedDecisions]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [MANUAL, AUTO] }
        counts: { $ref: "#/components/schemas/ApplicationCounts" }
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [position, name, status, reached, inReview]
            properties:
              position: { type: integer }
              name: { type: string }
              status: { type: string, enum: [DRAFT, OPEN, CLOSED] }
              reached: { type: integer }
              inReview: { type: integer }
        waitlist: { type: object, additionalProperties: false, required: [queued, passedOver], properties: { queued: { type: integer }, passedOver: { type: integer } } }
        draftedDecisions: { type: integer }

    AttendanceCounts:
      type: object
      additionalProperties: false
      required: [coming, notComing, noReply, notAsked]
      properties:
        coming: { type: integer }
        notComing: { type: integer }
        noReply: { type: integer, description: Asked, still confirmed and not answered. }
        notAsked: { type: integer, description: Confirmed, non-crew guests never asked. }

    MyAttendance:
      type: object
      additionalProperties: false
      required: [response, respondedAt, note, closed, releaseKind, releaseRefund]
      properties:
        response: { type: [string, "null"], enum: [ATTENDING, NOT_ATTENDING, null] }
        respondedAt: { type: [string, "null"], format: date-time }
        note: { type: string }
        closed: { type: [string, "null"], enum: [cancelled, started, notConfirmed, null] }
        releaseKind: { type: [string, "null"], enum: [free, paid, null], description: What a No would release right now; null keeps the place. }
        releaseRefund: { type: [string, "null"], description: "A paid release's refund under the policy, formatted (for example ₹249.50); null when nothing comes back." }

    MyAttendanceResult:
      type: object
      additionalProperties: false
      required: [attendance]
      properties:
        attendance:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/MyAttendance" }

    AttendanceReply:
      type: object
      additionalProperties: false
      required: [response, released, releaseFailed]
      properties:
        response: { type: string, enum: [ATTENDING, NOT_ATTENDING] }
        released: { type: boolean }
        releaseFailed: { type: [string, "null"], description: Why the place was kept after a No, when it was. }

    AttendanceLink:
      type: object
      additionalProperties: false
      required: [url, replaced]
      properties:
        url: { type: string, format: uri }
        replaced: { type: boolean, description: True when the guest had a link already; that one stops working. }

    OrgEvents:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            unevaluatedProperties: false
            allOf:
              - { $ref: "#/components/schemas/EventSummaryFields" }
              - type: object
                required: [counts, myPermissions]
                properties:
                  counts:
                    oneOf:
                      - { $ref: "#/components/schemas/EventCounts" }
                      - { type: "null" }
                  myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    OrgEventDetail:
      type: object
      additionalProperties: false
      required: [event, counts, myPermissions]
      properties:
        event:
          unevaluatedProperties: false
          allOf:
            - { $ref: "#/components/schemas/EventSummaryFields" }
            - type: object
              required: [privacyType, registrationOpen, registrationClosesAt, registrationClosedReason, registrationManuallyClosed, feedbackOpen, eventUrl, shortUrl]
              properties:
                privacyType: { $ref: "#/components/schemas/PrivacyType" }
                registrationOpen: { type: boolean }
                registrationClosesAt: { $ref: "#/components/schemas/NullableDateTime" }
                registrationClosedReason: { type: [string, "null"] }
                registrationManuallyClosed: { type: boolean, description: Sign-ups were closed from a mobile app and can be reopened there. }
                feedbackOpen: { type: boolean }
                eventUrl: { type: string, format: uri }
                shortUrl: { $ref: "#/components/schemas/NullableUrl" }
        counts:
          oneOf:
            - { $ref: "#/components/schemas/EventCounts" }
            - { type: "null" }
        myPermissions: { $ref: "#/components/schemas/EventPermissions" }

    Guest:
      description: Closed form of GuestFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/GuestFields" }]
      unevaluatedProperties: false

    GuestFields:
      description: The Guest properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [rsvpId, displayName, email, status, checkedInAt, registeredAt, isGuest]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        registeredAt: { $ref: "#/components/schemas/DateTime" }
        isGuest: { type: boolean, description: True when the registration has no account. }
        teamName: { type: string, description: TEAM events only; absent for solo registrants. }
        orderId: { type: string, description: The paid order this guest's ticket belongs to. }
        isCrew: { const: true, description: A free crew ticket; present only when true. }
        paymentOutcome: { type: string, enum: [LINK_SENT, REFUNDED], description: "Only in answers to approve, promote, reaccept and reject: a paid place was offered (the ticket confirms once paid) or a paid order refunded." }

    Detail:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    GuestList:
      type: object
      additionalProperties: false
      required: [guests, nextCursor]
      properties:
        guests: { type: array, items: { $ref: "#/components/schemas/Guest" } }
        nextCursor: { type: [string, "null"] }

    GuestDetail:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/GuestFields" }
        - type: object
          required: [answers]
          properties:
            answers: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Undo:
      type: object
      additionalProperties: false
      required: [undoId]
      properties:
        undoId: { type: string }

    CheckInResult:
      description: Closed form of CheckInResultFields (no other properties).
      allOf: [{ $ref: "#/components/schemas/CheckInResultFields" }]
      unevaluatedProperties: false

    CheckInResultFields:
      description: The CheckInResult properties, open so that allOf compositions can extend them; each composition closes itself with unevaluatedProperties false.
      type: object
      required: [rsvpId, displayName, email, status, alreadyCheckedIn, checkedInAt, checkInDetails, registrationDetails]
      properties:
        rsvpId: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        alreadyCheckedIn: { type: boolean }
        checkedInAt: { $ref: "#/components/schemas/NullableDateTime" }
        checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
        registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
        teamName: { type: string, description: TEAM events only; absent for solo registrants. }

    CheckInPreview:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/CheckInResultFields" }
        - type: object
          required: [gate, payment]
          properties:
            payment:
              oneOf:
                - { $ref: "#/components/schemas/PaymentInfo" }
                - { type: "null" }
            gate:
              oneOf:
                - { type: object, additionalProperties: false, required: [ok], properties: { ok: { const: true } } }
                - type: object
                  additionalProperties: false
                  required: [ok, reason, needsForce]
                  properties:
                    ok: { const: false }
                    reason: { type: string }
                    needsForce: { type: boolean }
                    blocked: { type: boolean }

    Lookup:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/Guest" } }

    CheckInStats:
      type: object
      additionalProperties: false
      required: [confirmed, checkedIn, recent]
      properties:
        confirmed: { type: integer }
        checkedIn: { type: integer }
        recent:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rsvpId, displayName, checkedInAt]
            properties:
              rsvpId: { type: string }
              displayName: { type: string }
              checkedInAt: { $ref: "#/components/schemas/DateTime" }

    RosterRow:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/GuestFields" }
        - type: object
          required: [ticketToken, checkInDetails, registrationDetails]
          properties:
            ticketToken: { type: string, description: Bearer capability; never log or persist outside the encrypted offline store. }
            checkInDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }
            registrationDetails: { type: array, items: { $ref: "#/components/schemas/Detail" } }

    Roster:
      type: object
      additionalProperties: false
      required: [generatedAt, rows]
      properties:
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        rows: { type: array, items: { $ref: "#/components/schemas/RosterRow" } }

    SyncResult:
      type: object
      additionalProperties: false
      required: [syncedIds, alreadyCheckedInIds, failed]
      properties:
        syncedIds: { type: array, items: { type: string } }
        alreadyCheckedInIds: { type: array, items: { type: string } }
        failed:
          type: array
          items: { type: object, additionalProperties: false, required: [rsvpId, error], properties: { rsvpId: { type: string }, error: { type: string } } }

    BroadcastAudience:
      type: object
      additionalProperties: false
      required: [statuses]
      properties:
        statuses: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    BroadcastContent:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 150 }
        body: { type: string, minLength: 1, maxLength: 20000, description: "Supported HTML subset: p, strong, em, h2, h3, ul, ol, li, blockquote, a, a.cta, br." }
        design: { type: string, enum: [classic, minimal, accent, photo, letter], default: classic }

    BroadcastsMeta:
      type: object
      additionalProperties: false
      required: [templates, designs, placeholders, history]
      properties:
        templates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, group, name, description, subject, bodyHtml, audience]
            properties:
              id: { type: string }
              group: { type: string }
              name: { type: string }
              description: { type: string }
              subject: { type: string }
              bodyHtml: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
        designs:
          type: array
          items: { type: object, additionalProperties: false, required: [id, label, description], properties: { id: { type: string }, label: { type: string }, description: { type: string } } }
        placeholders: { type: array, items: { type: string } }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, subject, design, audience, recipientCount, sentAt, bodyHtml]
            properties:
              id: { type: string }
              subject: { type: string }
              design: { type: string }
              audience: { $ref: "#/components/schemas/StoredAudience" }
              recipientCount: { type: integer }
              sentAt: { $ref: "#/components/schemas/DateTime" }
              bodyHtml: { type: string }

    StoredAudience:
      type: object
      additionalProperties: false
      required: [statuses, attendance]
      properties:
        statuses: { type: array, items: { $ref: "#/components/schemas/RsvpStatus" } }
        attendance: { $ref: "#/components/schemas/Attendance" }

    ScheduleSpeaker:
      type: object
      additionalProperties: false
      required: [id, name, headline, organisation, photoUrl]
      properties:
        id: { type: string }
        name: { type: string }
        headline: { type: [string, "null"] }
        organisation: { type: [string, "null"] }
        photoUrl: { type: [string, "null"], description: Absolute URL }

    Schedule:
      type: object
      additionalProperties: false
      required: [generatedAt, tracks]
      properties:
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        tracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, sessions]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title, type, visibility, startDateTime, endDateTime, delayMinutes, effectiveStartDateTime, effectiveEndDateTime, speakers]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    type: { type: string, description: "Session type label, for example Talk or Workshop" }
                    visibility: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN] }
                    startDateTime: { $ref: "#/components/schemas/DateTime" }
                    endDateTime: { $ref: "#/components/schemas/DateTime" }
                    delayMinutes: { type: integer, description: The session's stored live delay (what the delay control sets); planned times are unchanged. }
                    effectiveStartDateTime: { $ref: "#/components/schemas/DateTime", description: "Planned start shifted by the delays of earlier sessions in the same track (as on the public page)" }
                    effectiveEndDateTime: { $ref: "#/components/schemas/DateTime" }
                    speakers: { type: array, items: { $ref: "#/components/schemas/ScheduleSpeaker" } }

    # Success envelopes
    OrganiserTeam:
      type: object
      additionalProperties: false
      required: [id, name, status, size, minSize, maxSize, incomplete, lookingForMembers, leaderDisplayName, members]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        size: { type: integer }
        minSize: { type: [integer, "null"] }
        maxSize: { type: [integer, "null"] }
        incomplete: { type: boolean, description: Below the minimum team size; cannot be approved. }
        lookingForMembers: { type: boolean }
        leaderDisplayName: { type: [string, "null"] }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rsvpId, displayName, isLeader, checkedIn]
            properties:
              rsvpId: { type: string, description: Use with the guest routes (detail, check-in). }
              displayName: { type: string }
              isLeader: { type: boolean }
              checkedIn: { type: boolean }

    TeamList:
      type: object
      additionalProperties: false
      required: [teams, nextCursor, counts]
      properties:
        teams: { type: array, items: { $ref: "#/components/schemas/OrganiserTeam" } }
        nextCursor: { type: [string, "null"] }
        counts:
          type: object
          additionalProperties: false
          required: [ALL, CONFIRMED, WAITLISTED, PENDING_APPROVAL, REJECTED, INCOMPLETE, LOOKING]
          properties:
            ALL: { type: integer }
            CONFIRMED: { type: integer }

      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [open], properties: { open: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationStateResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }

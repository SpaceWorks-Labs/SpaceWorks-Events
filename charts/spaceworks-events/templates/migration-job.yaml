{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spaceworks-events.fullname" . }}-migrate
  labels:
    {{- include "spaceworks-events.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "spaceworks-events.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ default .Chart.AppVersion .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          # The reserved-address check fails the release before anything is
          # migrated when an organisation holds a slug this release reserves
          # (docs/production-operations.md, "Reserved organisation addresses").
          {{- if .Values.migration.checkInstanceSecrets }}
          # Also fail the release (before any pod rolls) when MFA_ENCRYPTION_KEY in
          # the runtime Secret cannot decrypt the Super admin -> Settings secrets.
          command: ["sh", "-c", "node scripts/check-reserved-slugs.mjs && docker-entrypoint.sh migrate && node scripts/check-instance-secrets.mjs"]
          {{- else }}
          # Then the backend image's migrate role (docker-entrypoint.sh).
          command: ["sh", "-c", "node scripts/check-reserved-slugs.mjs && docker-entrypoint.sh migrate"]
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}

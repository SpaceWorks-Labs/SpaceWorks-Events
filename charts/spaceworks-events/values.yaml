replicaCount: 1

# Web pod replacement on upgrade. The default rolling update keeps the site up
# but runs the old and new release side by side for a moment. For an upgrade
# whose notes say the old release must not run against the new schema, set
# `updateStrategy: {type: Recreate, rollingUpdate: null}` for that one release
# (Helm merges maps, so clear rollingUpdate): a short outage, but no overlap.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: ghcr.io/spaceworks-labs/spaceworks-events-backend
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Create this Secret outside Helm (External Secrets, Sealed Secrets, or kubectl).
# It must contain every production runtime variable in .env.example. It is
# mounted with envFrom on every app pod and on the migration Job, so all of them
# share one MFA_ENCRYPTION_KEY; keep that key stable, because it decrypts the
# SMTP/Google/alert-webhook secrets saved in Super admin -> Settings.
# Mobile apps (optional, docs/MOBILE_API.md): GOOGLE_MOBILE_CLIENT_IDS for app
# Google sign-in, and ANDROID_APP_PACKAGE_NAME, ANDROID_APP_SHA256_FINGERPRINTS
# and APPLE_APP_IDS for the /.well-known app-link files the web pods serve.
existingSecret: spaceworks-events-runtime

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: events.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

background:
  # Run email delivery (worker) and the timed jobs (beat) in their own
  # Deployments; the web pods then only serve requests. Turn off to run
  # everything in the web pods, as one-container installs do.
  enabled: true
  worker:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
  beat:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi

migration:
  # Runs the backend image's `migrate` role once per release.
  enabled: true
  image:
    repository: ghcr.io/spaceworks-labs/spaceworks-events-backend
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 300
  # After migrating, run scripts/check-instance-secrets.mjs and fail the release
  # if MFA_ENCRYPTION_KEY cannot decrypt secrets already saved in Super admin ->
  # Settings (rotated or mismatched key). Needs a backend image from this version
  # or later, which includes the script.
  checkInstanceSecrets: false

nodeSelector: {}
tolerations: []
affinity: {}
